name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade platformio
      - run: pio run -d firmware

  tools:
    name: Lint Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Job name kept as-is: the branch ruleset requires this exact check name.
      - run: pip install -r tools/requirements-dev.txt
      - run: ruff check tools
      - run: ruff format --check tools
      - name: Run tests
        run: pytest
        working-directory: tools
